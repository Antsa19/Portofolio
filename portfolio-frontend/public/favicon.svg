<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg)" stroke="url(#glow)" stroke-width="3" filter="url(#shadow)" />

  <!-- Code Brackets & Slash -->
  <!-- Left Bracket < -->
  <path d="M 22 22 L 14 32 L 22 42" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Slash / -->
  <path d="M 36 20 L 28 44" fill="none" stroke="url(#glow)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Right Bracket > -->
  <path d="M 42 22 L 50 32 L 42 42" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>